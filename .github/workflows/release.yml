name: Publish macOS downloads

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag, for example v0.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macOS-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Check release tag matches app version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' assets/Info.plist)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag must be v$version; received: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Check target release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "$RELEASE_TAG" --json url
      - name: Run offline tests
        run: scripts/test.sh
      - name: Build and package Apple Silicon and Intel app
        run: scripts/package-release.sh
      - name: Check archive checksums
        working-directory: release
        run: shasum -a 256 -c SHA256SUMS.txt
      - name: Attach downloads to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release/*.dmg release/*-macOS.zip release/*-source.zip \
            release/SHA256SUMS.txt --clobber
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
