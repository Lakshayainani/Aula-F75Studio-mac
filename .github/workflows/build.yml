name: Build macOS app
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline protocol and library tests
        run: scripts/test.sh
      - name: Build and package Apple Silicon and Intel app
        run: scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: F75Studio-macOS
          path: release/
